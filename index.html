<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Driver Saathi</title>
    <meta name="description" content="Driver Saathi - Your driving companion to manage earnings and expenses">
    <meta name="author" content="Driver Saathi" />

    <!-- Critical inline CSS for instant first paint (no render-blocking) -->
    <style>
      :root{--background:0 0% 100%;--foreground:0 0% 0%;--primary:0 0% 0%;--primary-foreground:0 0% 100%}
      .dark{--background:0 0% 0%;--foreground:0 0% 100%}
      *,::after,::before{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Roboto',system-ui,sans-serif;background-color:hsl(var(--background));color:hsl(var(--foreground));min-height:100dvh}
      #root{min-height:100dvh}
      /* Boot loader: painted with the HTML itself, before any JS downloads or
         parses, so the WebView never shows a bare white screen. React's first
         render replaces the contents of #root and with it this loader. */
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b2a5b;color:#fff;font-family:system-ui,sans-serif;z-index:2147483647}
      #boot img{width:96px;height:96px;border-radius:22px}
      #boot .n{font-size:20px;font-weight:700;letter-spacing:.3px}
      #boot .s{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#f5c518;animation:bs .8s linear infinite}
      #boot .r{display:none;margin-top:6px;padding:10px 18px;border:0;border-radius:8px;background:#f5c518;color:#0b2a5b;font-weight:700;font-size:15px}
      #boot.slow .r{display:block}
      @keyframes bs{to{transform:rotate(360deg)}}
    </style>

    <!-- PWA / Native App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Driver Saathi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preload critical fonts for faster rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://driver-saathi-app.web.app/icon-512.png">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://driver-saathi-app.web.app/icon-512.png">
    <meta property="og:title" content="Driver Saathi">
    <meta name="twitter:title" content="Driver Saathi">
    <meta property="og:description" content="Driver Saathi - Your driving companion to manage earnings and expenses">
    <meta name="twitter:description" content="Driver Saathi - Your driving companion to manage earnings and expenses">
  </head>

  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading Driver Saathi"><img src="/icon-192.png" alt="" width="96" height="96" /><div class="n">Driver Saathi</div><div class="s"></div><button class="r" type="button" onclick="location.reload()">Reload / दोबारा खोलें</button></div></div>
    <script>
      // Native splash -> HTML loader handoff. The loader above looks like the
      // native splash, so the splash can go as soon as the loader is painted
      // (keeps the system splash short). src/main.tsx hides it again after
      // React mounts in case the bridge was not ready here.
      (function () {
        function hideSplash() {
          try {
            var c = window.Capacitor;
            if (c && c.isNativePlatform && c.isNativePlatform() && c.nativePromise) {
              c.nativePromise("SplashScreen", "hide", { fadeOutDuration: 150 }).catch(function () {});
            }
          } catch (e) {}
        }
        requestAnimationFrame(function () { requestAnimationFrame(hideSplash); });
        setTimeout(hideSplash, 3000);
        // Watchdog: if the app has not rendered after 15 s (a script failed
        // to load or threw before React mounted), offer a reload instead of
        // an endless spinner.
        setTimeout(function () {
          var b = document.getElementById("boot");
          if (b && !window.__dsMounted) b.className = "slow";
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
