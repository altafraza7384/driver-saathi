name: Production Checks

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile
        run: |
          pwd
          test -f package.json
          test -f package-lock.json
          git ls-files --error-unmatch package-lock.json
          wc -c package-lock.json
          head -8 package-lock.json
          node -e "const p=require('./package-lock.json'); console.log('lockfileVersion=',p.lockfileVersion,'packages=',Object.keys(p.packages||{}).length)"
          npm config get package-lock
      - name: Install
        run: npm ci --no-audit --no-fund --package-lock=true
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Production build
        run: npm run build
