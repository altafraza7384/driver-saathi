name: Android debug APK (integration testing)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'firebase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest already includes Android SDK; setup-android@v3 currently fails installing retired 'tools' package.
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK not found'; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
      - name: Install dependencies
        run: npm ci
      - name: Compile web assets
        run: npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Bundle web app locally (never load remote Lovable URL)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'capacitor.config.ts';
          const c = fs.readFileSync(p, 'utf8');
          const updated = c.replace(/\s*server:\s*\{[\s\S]*?\},?/, '');
          if (updated === c) throw new Error('Expected remote server configuration not found');
          fs.writeFileSync(p, updated);
          NODE
      - name: Android Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          elif [ -f public/google-services.json ]; then
            cp public/google-services.json android/app/google-services.json
          else
            echo "::error::Firebase Android google-services.json is missing"
            exit 1
          fi
          node -e 'const x=require("./android/app/google-services.json"); if (!x.client?.some(c=>c.client_info?.android_client_info?.package_name==="com.driversaathi.app")) process.exit(1)'
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Build unsigned-for-release debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-saathi-debug-apk-NOT-PRODUCTION
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
