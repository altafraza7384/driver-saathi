# Driver Saathi — Firebase Hosting manual deploy (WEB track, added 2026-10-24).
#
# Why this exists: the live site is moving off driver-saathi.lovable.app
# (whose free plan forces the "Edit with Lovable" badge) to Firebase
# Hosting on the SAME Firebase project (driver-saathi-app, Spark free
# tier). Hosting serves only the static web bundle — it has no badge.
#
# How updates flow after this migration:
#  - WEB feature add/remove (src/, pages, i18n, styles): push to main runs
#    Production Checks only. THIS workflow builds dist/ and deploys it to
#    Hosting only when manually dispatched after explicit release approval.
#    The installed native app loads the site through server.url on next
#    open, so users get the feature with NO new APK and NO Play upload.
#  - NATIVE change (capacitor.config.ts, new Capacitor plugin, icon):
#    handled by android-play-release.yml, which now triggers ONLY on
#    native-relevant paths, plus manual dispatch.
#
# What this workflow does NOT do:
#  - It does not change server.url. Until server.url is pointed at the
#    Hosting URL (a separate, later step, only AFTER the first Hosting
#    deploy is verified live), the installed app keeps loading lovable.app.
#  - It does not deploy Firestore rules, Storage rules, or Cloud Functions.
#    Those are separate deploys (rules were published from the console;
#    functions are Blaze-gated).
#
# Authentication (KEYLESS, via Workload Identity Federation — set up
# 2026-10-24 after Google blocked service-account key creation with the
# iam.disableServiceAccountKeyCreation organization policy):
#  - Google Cloud pool "github" + provider "github" (OIDC issuer
#    https://token.actions.githubusercontent.com), attribute condition
#    limited to repo altafraza7384/driver-saathi AND branch
#    refs/heads/main. The existing service account
#    firebase-hosting-deploy@driver-saathi-app.iam.gserviceaccount.com
#    (Firebase Hosting Admin only) is granted Workload Identity User to
#    that repo's principalSet. No key file, no GitHub secret, no secret
#    rotation: each run gets a short-lived token from GitHub's OIDC
#    provider (hence the job-level id-token: write permission below).
#  - The google-github-actions/auth step sets up Application Default
#    Credentials for the run and cleans them up when the job ends.
#  - If this auth step fails, the job fails with a clear message instead
#    of deploying nothing silently.

name: Firebase Hosting Deploy

"on":
  # Manual only: merging code must not deploy the live website by itself.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is kept only so the deploy step can run firebase-tools
      # via npx. Dependencies themselves are installed with BUN, not
      # npm: this repo's package manager is bun (bun.lock is the source
      # of truth) and package-lock.json is stale — strict `npm ci`
      # fails on it twice over (first the firebase 13 peer conflict,
      # then "Missing: ..." entries for packages bun added). Switching
      # the install to bun removes both failures at once, with no app
      # code or dependency version change.
      - name: Setup Node (for npx firebase-tools only)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      # Typecheck gate (audit 2026-10-24): vite build does NOT
      # typecheck, so the 2026-10-23 Finance white-screen (a missing
      # useI18n that tsc catches) shipped straight to production.
      # This step fails the deploy on type errors.
      - name: Typecheck
        run: bun x tsc --noEmit

      # .env is tracked in this repo (Lovable builds read it). Its keys
      # must all be publishable VITE_* client keys — a non-VITE_ secret
      # added later would be committed silently (audit 2026-10-24).
      - name: Guard tracked .env (no non-VITE_ secrets)
        run: |
          if grep -Eq '^[A-Z][A-Z0-9_]*=' .env | grep -v '^VITE_'; then
            echo "ERROR: non-VITE_ key found in tracked .env" >&2
            exit 1
          fi

      - name: Build web bundle
        run: bun run build

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/282968056888/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "firebase-hosting-deploy@driver-saathi-app.iam.gserviceaccount.com"

      # Deploy step: firebase.json lives in firebase/ (it also carries
      # firestore/storage/functions/emulator config for later deploys),
      # and its hosting.public "../dist" is REJECTED by firebase-tools
      # when run from firebase/ ("../dist is outside of project
      # directory"). So instead of touching that shared config, this
      # step writes a hosting-only config at the repo root for this
      # run only (public "dist" is inside the root project directory,
      # same rewrites as firebase.json) and deploys from the root.
      # The file is generated in the runner and never committed.
      #
      # SECURITY HEADERS — KEEP IN SYNC: this heredoc is what actually
      # deploys. The root firebase.json is NOT read by this workflow, so
      # a header change there alone never reaches the live site. The
      # headers block below MUST stay identical to the headers block in
      # the root firebase.json (and public/_headers, the Lovable-era
      # copy). Change all three together, or the saved config and the
      # live config drift apart again.
      #
      # Why the headers cover "**" and not just "/index.html": the SPA
      # rewrite serves /index.html content for every route, but Firebase
      # matches header rules against the REQUEST path, so a request for
      # /more never matched "/index.html" and got no security headers.
      # "**" applies them to every HTML route. The "/assets/**" rule
      # stays listed AFTER "**" so its immutable Cache-Control wins for
      # hashed assets (later matching rules override earlier ones for
      # the same header key).
      #
      # CSP — why each origin is allowed (verified by code inspection,
      # 2026-11-22; no live login/payment test was run):
      #  - 'unsafe-inline' (script + style): index.html ships inline
      #    boot/splash code (an inline <style>, an inline <script> and
      #    an onclick="location.reload()"). Removing it needs an
      #    index.html refactor first; until then a CSP without it would
      #    break first paint. No 'unsafe-eval'.
      #  - frame-src *.firebaseapp.com: Firebase Auth (signInWithPopup,
      #    with a signInWithRedirect fallback — see adapter.ts) runs a
      #    hidden auth iframe on the auth domain
      #    (<project>.firebaseapp.com/__/auth/iframe). Without this,
      #    Google login breaks. Top-level redirect navigation is not
      #    CSP-gated, so the redirect fallback is unaffected either way.
      #  - script-src https://apis.google.com: the Firebase Auth SDK
      #    injects https://apis.google.com/js/api.js at runtime for
      #    signInWithPopup — a real-browser isolated probe blocked
      #    exactly that script before this origin was added (2026-11-22).
      #  - STAGED ENFORCEMENT (2026-11-22): no live browser is available
      #    in this sandbox, so no live Google login or Razorpay checkout
      #    has been run against this CSP. Before relying on it: deploy,
      #    sign in with Google on the live URL, open Razorpay sandbox
      #    checkout, and watch the console for CSP violations (in
      #    particular any frame/connect-src from accounts.google.com the
      #    popup flow may need — do NOT pre-add origins without an
      #    observed violation). A config match is not a login pass.
      #  - script-src + frame-src + connect-src *.razorpay.com:
      #    SubscriptionPlansCard loads checkout.js from
      #    checkout.razorpay.com on demand and opens the Razorpay
      #    checkout iframe; the iframe and its API calls live under
      #    *.razorpay.com. Without these, the paid-plan checkout breaks.
      #  - connect-src *.googleapis.com: Firestore, Identity Toolkit /
      #    Secure Token (auth), Firebase Installations and FCM
      #    registration all live here.
      #  - connect-src *.cloudfunctions.net: the AI chat / finance-AI
      #    callables (asia-south1) and the Razorpay subscription
      #    callables are httpsCallable Cloud Functions.
      #  - style-src fonts.googleapis.com + font-src fonts.gstatic.com:
      #    Montserrat/Roboto loaded in index.html.
      #  - connect-src *.supabase.co, *.firebaseio.com, lovable.dev,
      #    *.lovable.app: kept for the legacy Supabase/Lovable code
      #    path behind VITE_BACKEND (not the live Firebase path). They
      #    cost nothing and keep that build working.
      #  - No Permissions-Policy on purpose: the app uses Geolocation
      #    (Car SOS GPS) and the microphone (speech / driving mode), so
      #    a restrictive policy would break features. Add one only with
      #    geolocation=(self) and microphone=(self) preserved.
      #  - frame-ancestors 'none' (+ X-Frame-Options DENY) is safe: the
      #    native app loads the site as the top-level document in its
      #    WebView, not inside a frame.
      - name: Deploy to Firebase Hosting
        run: |
          cat > firebase-hosting-deploy.json <<'EOF'
          {
            "hosting": {
              "public": "dist",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                { "source": "**", "headers": [
                  { "key": "Cache-Control", "value": "no-cache" },
                  { "key": "X-Content-Type-Options", "value": "nosniff" },
                  { "key": "X-Frame-Options", "value": "DENY" },
                  { "key": "Strict-Transport-Security", "value": "max-age=31536000; includeSubDomains" },
                  { "key": "Referrer-Policy", "value": "strict-origin-when-cross-origin" },
                  { "key": "Content-Security-Policy", "value": "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://*.razorpay.com https://*.supabase.co wss://*.supabase.co https://lovable.dev https://*.lovable.app; frame-src 'self' https://*.firebaseapp.com https://*.razorpay.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" }
                ] },
                { "source": "/assets/**", "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }
                ] }
              ]
            }
          }
          EOF
          npx -y firebase-tools@latest deploy --only hosting --config firebase-hosting-deploy.json --project driver-saathi-app --non-interactive
