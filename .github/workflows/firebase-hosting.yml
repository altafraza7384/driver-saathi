# Driver Saathi — Firebase Hosting auto-deploy (WEB track, added 2026-10-24).
#
# Why this exists: the live site is moving off driver-saathi.lovable.app
# (whose free plan forces the "Edit with Lovable" badge) to Firebase
# Hosting on the SAME Firebase project (driver-saathi-app, Spark free
# tier). Hosting serves only the static web bundle — it has no badge.
#
# How updates flow after this migration:
#  - WEB feature add/remove (src/, pages, i18n, styles): push to main ->
#    THIS workflow builds dist/ and deploys it to Hosting automatically.
#    The installed native app loads the site through server.url on next
#    open, so users get the feature with NO new APK and NO Play upload.
#  - NATIVE change (capacitor.config.ts, new Capacitor plugin, icon):
#    handled by android-play-release.yml, which now triggers ONLY on
#    native-relevant paths, plus manual dispatch.
#
# What this workflow does NOT do:
#  - It does not change server.url. Until server.url is pointed at the
#    Hosting URL (a separate, later step, only AFTER the first Hosting
#    deploy is verified live), the installed app keeps loading lovable.app.
#  - It does not deploy Firestore rules, Storage rules, or Cloud Functions.
#    Those are separate deploys (rules were published from the console;
#    functions are Blaze-gated).
#
# Authentication (KEYLESS, via Workload Identity Federation — set up
# 2026-10-24 after Google blocked service-account key creation with the
# iam.disableServiceAccountKeyCreation organization policy):
#  - Google Cloud pool "github" + provider "github" (OIDC issuer
#    https://token.actions.githubusercontent.com), attribute condition
#    limited to repo altafraza7384/driver-saathi AND branch
#    refs/heads/main. The existing service account
#    firebase-hosting-deploy@driver-saathi-app.iam.gserviceaccount.com
#    (Firebase Hosting Admin only) is granted Workload Identity User to
#    that repo's principalSet. No key file, no GitHub secret, no secret
#    rotation: each run gets a short-lived token from GitHub's OIDC
#    provider (hence the job-level id-token: write permission below).
#  - The google-github-actions/auth step sets up Application Default
#    Credentials for the run and cleans them up when the job ends.
#  - If this auth step fails, the job fails with a clear message instead
#    of deploying nothing silently.

name: Firebase Hosting Deploy

"on":
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - "firebase/firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is kept only so the deploy step can run firebase-tools
      # via npx. Dependencies themselves are installed with BUN, not
      # npm: this repo's package manager is bun (bun.lock is the source
      # of truth) and package-lock.json is stale — strict `npm ci`
      # fails on it twice over (first the firebase 13 peer conflict,
      # then "Missing: ..." entries for packages bun added). Switching
      # the install to bun removes both failures at once, with no app
      # code or dependency version change.
      - name: Setup Node (for npx firebase-tools only)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/282968056888/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "firebase-hosting-deploy@driver-saathi-app.iam.gserviceaccount.com"

      # Deploy step: firebase.json lives in firebase/ (it also carries
      # firestore/storage/functions/emulator config for later deploys),
      # and its hosting.public "../dist" is REJECTED by firebase-tools
      # when run from firebase/ ("../dist is outside of project
      # directory"). So instead of touching that shared config, this
      # step writes a hosting-only config at the repo root for this
      # run only (public "dist" is inside the root project directory,
      # same rewrites as firebase.json) and deploys from the root.
      # The file is generated in the runner and never committed.
      - name: Deploy to Firebase Hosting
        run: |
          cat > firebase-hosting-deploy.json <<'EOF'
          {
            "hosting": {
              "public": "dist",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            }
          }
          EOF
          npx -y firebase-tools@latest deploy --only hosting --config firebase-hosting-deploy.json --project driver-saathi-app --non-interactive
